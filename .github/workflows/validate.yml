name: Validate AFD release

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation requirements
        run: python -m pip install -r skills/ai-film-director-4/requirements-test.txt
      - name: Verify skill release and regression suite
        run: python skills/ai-film-director-4/scripts/verify_release.py --skill-root skills/ai-film-director-4
